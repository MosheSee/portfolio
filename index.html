  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Moshe Levy — Marketing, Content &amp; Copywriting<\u002Ftitle>\n<meta name=\"description\" content=\"Portfolio of Moshe Levy — marketing, copywriting and content: a live landing page, a TikTok growth experiment with real data, and campaign concepts.\">\n<link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-style='italic' font-size='15' fill='%2338a6cf' text-anchor='middle'%3EML%3C/text%3E%3C/svg%3E\">\n<script src=\"d2c2581c-888a-4675-98d5-bbf3d2286f4d\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Broadsheet — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2f392522-ade6-4b23-83f1-11dd75a63a40\") format('woff2');\n  unicode-range: U+20-22, U+25-29, U+2b-3b, U+3f-5a, U+61-7a, U+b7, U+2013-2014, U+2190, U+2192;\n}\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a97c43a7-d370-491c-90ac-8103e91d555f\") format('woff2');\n  unicode-range: U+20-22, U+25-29, U+2b-3b, U+3f-5a, U+61-7a, U+b7, U+2013-2014, U+2190, U+2192;\n}\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a97c43a7-d370-491c-90ac-8103e91d555f\") format('woff2');\n  unicode-range: U+20-22, U+25-29, U+2b-3b, U+3f-5a, U+61-7a, U+b7, U+2013-2014, U+2190, U+2192;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"bcb4ab18-8fe2-4a79-b9c8-766b3f2d8059\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* hebrew */\n@font-face {\n  font-family: 'Assistant';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"23e72497-fcad-4608-a6c1-d341571613b5\") format('woff2');\n  unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Assistant';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"decf21b9-b785-417f-bce2-7f1cd8bd8848\") format('woff2');\n  unico 00;\n  font-display: swap;\n  src: url(\"fb331d02-c991-46de-bd33-3f62257e89e5\") format('woff2');\n  unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Frank Ruhl Libre';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"72c85ab6-e9de-4a0a-a2c0-11ac54c0a202\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Frank Ruhl Libre';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"19ba8c9f-491d-4ecb-9370-a8f6200dd378\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --color-bg: #0a0a0a;\n    --color-surface: #141313;\n    --color-raise: #1c1a1a;\n    --color-text: #f3f1ef;\n    --color-divider: color-mix(in srgb, #f3f1ef 14%, transparent);\n    --color-neutral-100: #2d2b2b;\n    --color-neutral-200: #444141;\n    --color-neutral-300: #605d5d;\n    --color-neutral-400: #7d7979;\n    --color-neutral-500: #9b9797;\n    --color-neutral-600: #bab6b6;\n    --color-neutral-700: #d7d3d3;\n    --color-neutral-800: #eae7e7;\n    --color-neutral-900: #f8f4f4;\n    --shadow-sm: 0 1px 0 color-mix(in srgb, #f3f1ef 8%, transparent) inset, 0 2px 6px color-mix(in srgb, #000 55%, transparent);\n    --shadow-md: 0 1px 0 color-mix(in srgb, #f3f1ef 8%, transparent) inset, 0 6px 18px color-mix(in srgb, #000 60%, transparent);\n    --shadow-lg: 0 1px 0 color-mix(in srgb, #f3f1ef 10%, transparent) inset, 0 16px 40px color-mix(in srgb, #000 65%, transparent);\n    --pad: clamp(20px, 5vw, 64px);\n    --wrap: 1240px;\n  }\n  [lang= ef || done[href]) return;\n    done[href] = true;\n    var l = document.createElement('link');\n    l.rel = 'prefetch';\n    l.href = href;\n    document.head.appendChild(l);\n  }\n  function onHint(e){\n    var a = e.target.closest && e.target.closest('a[href$=\".html\"]');\n    if(a) prefetch(a.getAttribute('href').split('#')[0]);\n  }\n  document.addEventListener('mouseover', onHint, {passive:true});\n  document.addEventListener('touchstart', onHint, {passive:true});\n})();\n<\u002Fscript>\n<\u002Fhelmet>\n\n<div dir=\"rtl\" lang=\"he\" data-lang-pane=\"he\" style=\"background: var(--color-bg); color: var(--color-text); font-family: var(--font-ui); -webkit-font-smoothing: antialiased\">\n\n<header style=\"position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px var(--pad); background: color-mix(in srgb, var(--color-bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-divider)\">\n  <a href=\"#top\" data-brand=\"\" style=\"display: flex; align-items: center; gap: 10px; color: inherit; flex: none\">\n    <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .12em; color: var(--color-text)\">ML<\u002Fspan>\n    <span style=\"width: 26px; height: 2px; background: var(--color-accent-500)\"><\u002Fspan>\n  <\u002Fa>\n  <nav style=\"display: flex; align-items: center; gap: clamp(9px, 2.2vw, 30px); font-size: 13.5px\">\n    <a href=\"#work\" style=\"color: var(--color-neutral-700)\" style-hover=\"color: var(--color-accent-400)\">עבודות<\u002Fa>\n    <a href=\"#contact\" style=\"color: var(--color-neutral-700)\" style-hover=\"color: var(--color-accent-400)\">קשר<\u002Fa>\n    <span style=\"display: flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .06em; padding-inline-start: clamp(4px, 1vw, 12px); border-inline-start: 1px solid var(--color-divider)\">\n      <button type=\"button\" data-lang-btn=\"he\" aria-label=\"עברית\" style=\"background: none; border: 0; padding: 12px 7px; margin: -12px -7px; font: inherit; letter-spacing: .06em; cursor: pointer; color: var(--color-accent-400)\">HE<\u002Fbutton>\n      <span style=\"color: var(--color-neutral-400)\">/<\u002Fspan>\n      <button type=\"button\" data-lang-btn=\"en\" aria-label=\"English\" style=\"background: none; border: 0; padding: 12px 7px; margin: -12px -7px; font: inherit; letter-spacing: .06em; cursor: pointer; color: var(--color-neutral-500)\" style-hover=\"color: var(--color-accent-400)\">EN<\u002Fbutton>\n    <\u002Fspan>\n  <\u002Fnav>\n  <div id=\"scroll-bar-he\" style=\"position: absolute; bottom: -1px; inset-inline-start: 0; height: 2px; width: 0%; background: var(--color-accent-400); transition: width .1s linear\"><\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"top\" style=\"padding: clamp(48px, 8vh, 96px) var(--pad) clamp(30px, 5vh, 56px); scroll-margin-top: 66px\">\n  <div data-hero-grid=\"\" style=\"max-width: var(--wrap); margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: clamp(24px, 5vw, 64px)\">\n    <div style=\"min-width: 0\">\n      <div style=\"display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .16em; color: var(--color-neutral-600); margin-bottom: clamp(20px, 4vh, 34px)\">\n        <span style=\"width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--color-accent-500); animation: mlpulse 2.8s ease-in-out infinite; will-change: opacity\"><\u002Fspan>\n        משה לוי · שיווק · קופירייטינג · דיגיטל\n      <\u002Fdiv>\n      <h1 data-hero-title=\"\" style=\"font-family: var(--font-display); font-weight: 500; font-size: clamp(21px, 2.7vw, 41px); line-height: 1.22; letter-spacing: -.015em; margin: 0; color: var(--color-text); white-space: nowrap\"><span style=\"display: block\">במשך שנים הקשבתי ללקוחות.<\u002Fspan><span style=\"display: block; color: var(--color-accent-400)\">היום אני כותב את המילים שגורמות לאנשים <span id=\"cycle-word-he\" style=\"display: inline-block; transition: opacity .35s ease, transform .35s ease\">לעצור<\u002Fspan>.<\u002Fspan><\u002Fh1>\n      <p style=\"max-width: 44ch; margin: clamp(20px, 3vh, 32px) 0 0; font-size: clamp(16px, 1.2vw, 19px); line-height: 1.6; color: var(--color-neutral-700); text-wrap: pretty\">אנשים לא צריכים עוד הסברים. הם צריכים את הסיבה הנכונה. זו החשיבה שמאחורי כל דף וכל סרטון שאני בונה.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: clamp(26px, 4vh, 40px)\">\n        <a href=\"#work\" class=\"btn btn-primary\" style=\"padding: 13px 26px; font-size: 15px\">לצפייה בעבודות<\u002Fa>\n        <a href=\"#contact\" class=\"btn btn-secondary\" style=\"padding: 13px 22px; font-size: 15px; border-color: var(--color-neutral-300); color: var(--color-text)\" style-hover=\"border-color: var(--color-accent-500); color: var(--color-accent-400)\">בואו נדבר<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-portrait=\"\" style=\"width: clamp(180px, 24vw, 320px); flex: none\">\n      <div style=\"aspect-ratio: 1/1; overflow: hidden; border-radius: 50%; background: #000; border: 5px solid var(--color-accent-500)\">\n        <image-slot id=\"ml-portrait\" shape=\"circle\" fit=\"cover\" src=\"70acbb92-4156-41f3-852a-9376e145fb38\" placeholder=\"תמונה שלך\" role=\"img\" aria-label=\"משה לוי\" style=\"width: 100%; height: 100%\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-hero-facts=\"\" style=\"max-width: var(--wrap); margin: clamp(34px, 6vh, 60px) auto 0; padding-top: clamp(26px, 4vh, 38px); border-top: 1px solid var(--color-divider); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(22px, 5vw, 64px)\">\n    <div>\n      <div style=\"font-size: 12px; letter-spacing: .16em; color: var(--color-neutral-500); margin-bottom: 10px\">מה אני מביא<\u002Fdiv>\n      <p style=\"margin: 0; max-width: 48ch; font-size: 15px; line-height: 1.7; color: var(--color-neutral-800); text-wrap: pretty\">חשיבה שיווקית, אינסטינקט אמיתי לקהל, וידיים שמבצעות: מהרעיון ועד המסר שעולה לאוויר.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size: 12px; letter-spacing: .16em; color: var(--color-neutral-500); margin-bottom: 10px\">מה אני מחפש<\u002Fdiv>\n      <p style=\"margin: 0; max-width: 48ch; font-size: 15px; line-height: 1.7; color: var(--color-neutral-800); text-wrap: pretty\">תפקיד ג'וניור בשיווק דיגיטלי, קופירייטינג או AI, שבו אני יכול להפוך סקרנות, חשיבה יצירתית והרגל לבדוק לעבודה שבאמת מביאה תוצאות.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-label=\"מספרים\" style=\"padding: clamp(26px, 4vh, 40px) var(--pad); border-top: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider); background: var(--color-surface)\">\n  <div style=\"max-width: var(--wrap); margin: 0 auto\">\n    <div data-stats=\"\" style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(16px, 3vw, 40px)\">\n      <div>\n        <div dir=\"ltr\" style=\"font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 3.6vw, 46px); line-height: 1; letter-spacing: -.02em; color: var(--color-accent-2-400); text-align: end\">1.8M<\u002Fdiv>\n        <div style=\"font-size: 12.5px; line-height: 1.45; color: var(--color-neutral-600); margin-top: 10px\">צפיות בסרטון אחד<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div dir=\"ltr\" style=\"font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 3.6vw, 46px); line-height: 1; letter-spacing: -.02em; color: var(--color-accent-2-400); text-align: end\">3,049<\u002Fdiv>\n        <div style=\"font-size: 12.5px; line-height: 1.45; color: var(--color-neutral-600); margin-top: 10px\">עוקבים שנבנו מאפס<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div dir=\"ltr\" style=\"font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 3.6vw, 46px); line-height: 1; letter-         <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px\">\n            <div style=\"font-family: var(--font-display); font-style: italic; font-size: 13px; color: var(--color-accent-400); white-space: nowrap; padding-top: 3px\">2021—2023<\u002Fdiv>\n            <div>\n              <div style=\"font-size: 15.5px; color: var(--color-text)\">Retention &amp; Win-back · Pelephone<\u002Fdiv>\n              <div style=\"font-size: 13.5px; color: var(--color-neutral-600); line-height: 1.6; margin-top: 5px\">Sales, tailored offers, and reading what actually mattered to each customer.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px\">\n            <div style=\"font-family: var(--font-display); font-style: italic; font-size: 13px; color: var(--color-neutral-500); white-space: nowrap; padding-top: 3px\">Earlier<\u002Fdiv>\n            <div>\n              <div style=\"font-size: 15.5px; color: var(--color-neutral-700)\">Service &amp; sales · Rimark / HOT<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: clamp(28px, 4vh, 40px)\">\n          <a href=\"moshe-levy-cv.pdf\" download=\"Moshe-Levy-CV.pdf\" class=\"btn btn-primary\" style=\"padding: 12px 20px; font-size: 14.5px\">Download resume ↓<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact-en\" style=\"padding: clamp(72px, 13vh, 150px) var(--pad) clamp(36px, 6vh, 60px); scroll-margin-top: 66px\">\n  <div data-reveal=\"\" style=\"max-width: var(--wrap); margin: 0 auto\">\n    <h2 style=\"font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 5.6vw, 78px); line-height: 1.04; letter-spacing: -.035em; margin: 0 0 26px; color: var(--color-text); max-width: 20ch; text-wrap: balance\">Got an idea?<br><span style=\"color: var(--color-accent-2-400); font-style: italic\">Let's make it impossible to ignore.<\u002Fspan><\u002Fh2>\n    <p style=\"margin: 0 0 34px; font-size: clamp(15.5px, 1.2vw, 18px); line-height: 1.65; color: var(--color-neutral-600); max-width: 46ch; text-wrap: pretty\">Have a role, project, or idea in mind? Let's talk.<\u002Fp>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: clamp(40px, 7vh, 76px)\">\n      <a href=\"mailto:moshe1909000@gmail.com\" class=\"btn btn-primary\" style=\"padding: 14px 26px; font-size: 15px\">Email me<\u002Fa>\n      <a href=\"https://www.linkedin.com/in/moshe-levy-sl1996/\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"padding: 14px 22px; font-size: 15px; border-color: var(--color-neutral-300); color: var(--color-text)\" style-hover=\"border-color: var(--color-accent-500); color: var(--color-accent-400)\">LinkedIn<\u002Fa>\n      <a href=\"tel:+972509015841\" class=\"btn btn-secondary\" style=\"padding: 14px 22px; font-size: 15px; border-color: var(--color-neutral-300); color: var(--color-text)\" style-hover=\"border-color: var(--color-accent-500); color: var(--color-accent-400)\">Call me<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-top: 22px; border-top: 1px solid var(--color-divider)\">\n      <span style=\"font-family: var(--font-display); font-size: 13px; letter-spacing: .1em; color: var(--color-neutral-500)\">ML · MOSHE LEVY<\u002Fspan>\n      <span style=\"font-size: 12.5px; color: var(--color-neutral-400)\">Designed &amp; built by me<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n\n<button type=\"button\" aria-label=\"Back to top\" data-back-to-top=\"\" style=\"position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); inset-inline-end: 20px; z-index: 60; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--color-accent-500) 45%, transparent); background: color-mix(in srgb, var(--color-bg) 78%, transparent); backdrop-filter: blur(4px); color: var(--color-accent-500); font-size: 17px; line-height: 1; cursor: pointer; opacity: 0; visibility: hidden; transform: translateY(6px); transition: opacity .25s ease, transform .25s ease, border-color .2s ease, color .2s ease; pointer-events: none\" style-hover=\"border-color: var(--color-accent-400); color: var(--color-accent-400)\">↑<\u002Fbutton>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;he&quot;,&quot;en&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'he' | 'en'&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;showPortrait&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;animateReveal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches\n      || this.props.animateReveal === false;\n    let saved = null;\n    try { saved = localStorage.getItem('ml-portfolio-lang'); } catch (e) {}\n    const fallback = this.props.defaultLang === 'en' ? 'en' : 'he';\n    this.setLang(saved === 'en' ? 'en' : (saved === 'he' ? 'he' : fallback), true);\n    if (this.props.showPortrait === false) {\n      document.querySelectorAll('[data-portrait]').forEach(p => { p.style.display = 'none'; });\n    }\n    this._onClick = e => {\n      const lang = e.target.closest && e.target.closest('[data-lang-btn]');\n      if (lang) { e.preventDefault(); this.setLang(lang.getAttribute('data-lang-btn')); }\n    };\n    document.addEventListener('click', this._onClick);\n    this.setupCycleWord();\n    this.setupBackToTop();\n    this.setupScrollFx();\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener('click', this._onClick);\n    if (this._io) this._io.disconnect();\n    if (this._cycleTimer) clearInterval(this._cycleTimer);\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._onBackToTopScroll) {\n      window.removeEventListener('scroll', this._onBackToTopScroll, { capture: true });\n      document.removeEventListener('scroll', this._onBackToTopScroll, { capture: true });\n    }\n    const btt = document.querySelector('[data-back-to-top]');\n    if (btt && this._onBackToTopClick) btt.removeEventListener('click', this._onBackToTopClick);\n  }\n\n  setupCycleWord() {\n    const words = { he: ['לעצור', 'להקשיב', 'לפעול'], en: ['stop', 'listen', 'act'] };\n    let idx = 0;\n    if (this.reduce) return;\n    this._cycleTimer = setInterval(() => {\n      idx = (idx + 1) % 3;\n      [['cycle-word-he', words.he], ['cycle-word-en', words.en]].forEach(([id, list]) => {\n        const el = document.getElementById(id);\n        if (!el) return;\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(4px)';\n        setTimeout(() => {\n          el.textContent = list[idx];\n          el.style.opacity = '1';\n          el.style.transform = 'translateY(0)';\n        }, 350);\n      });\n    }, 2600);\n  }\n\n  setupScrollFx() {\n    this.navMap = {\n      he: ['work', 'contact'],\n      en: ['work-en', 'contact-en']\n    };\n    this._scrollBars = [document.getElementById('scroll-bar-he'), document.getElementById('scroll-bar-en')];\n    this._navLinks = {};\n    Object.keys(this.navMap).forEach(lang => {\n      this._navLinks[lang] = this.navMap[lang].map(id => ({\n        id, el: document.getElementById(id), link: document.querySelector('a[href=\"#' + id + '\"]')\n      }));\n    });\n    let ticking = false;\n    this._onScroll = () => {\n      if (ticking) return;\n      ticking = true;\n      requestAnimationFrame(() => { this.updateScrollFx(); ticking = false; });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this.updateScrollFx();\n  }\n\n  updateScrollFx() {\n    const doc = document.documentElement;\n    const scrolled = doc.scrollTop || document.body.scrollTop;\n    const height = (doc.scrollHeight - doc.clientHeight) || 1;\n    const pctStr = Math.min(100, Math.max(0, (scrolled / height) * 100)) + '%';\n    this._scrollBars.forEach(bar => { if (bar) bar.style.width = pctStr; });\n    const lang = doc.getAttribute('lang') === 'en' ? 'en' : 'he';\n    const items = this._navLinks[lang];\n    if (!items) return;\n    let current = null;\n    items.forEach(({ id, el }) => {\n      if (el && el.getBoundingClientRect().top <= 160) current = id;\n    });\n    items.forEach(({ id, link }) => {\n      if (link) link.style.color = id === current ? 'var(--color-accent-400)' : 'var(--color-neutral-700)';\n    });\n  }\n\n  setupBackToTop() {\n    const btn = document.querySelector('[data-back-to-top]');\n    if (!btn) return;\n    this._onBackToTopClick = () => {\n      const behavior = this.reduce ? 'auto' : 'smooth';\n      window.scrollTo({ top: 0, behavior });\n      document.documentElement.scrollTo({ top: 0, behavior });\n      document.body.scrollTo({ top: 0, behavior });\n    };\n    btn.addEventListener('click', this._onBackToTopClick);\n    let visible = false;\n    this._onBackToTopScroll = () => {\n      const scrolled = document.documentElement.scrollTop || document.body.scrollTop;\n      const show = scrolled > 520;\n      if (show === visible) return;\n      visible = show;\n      btn.style.opacity = show ? '1' : '0';\n      btn.style.visibility = show ? 'visible' : 'hidden';\n      btn.style.transform = show ? 'none' : 'translateY(6px)';\n      btn.style.pointerEvents = show ? 'auto' : 'none';\n    };\n    window.addEventListener('scroll', this._onBackToTopScroll, { passive: true, capture: true });\n    document.addEventListener('scroll', this._onBackToTopScroll, { passive: true, capture: true });\n    this._onBackToTopScroll();\n  }\n\n  setLang(lang, initial) {\n    const panes = document.querySelectorAll('[data-lang-pane]');\n    if (!panes.length) return;\n    panes.forEach(p => { p.hidden = p.getAttribute('data-lang-pane') !== lang; });\n    document.querySelectorAll('[data-lang-btn]').forEach(b => {\n      const on = b.getAttribute('data-lang-btn') === lang;\n      b.style.color = on ? 'var(--color-accent-400)' : 'var(--color-neutral-500)';\n      b.setAttribute('aria-current', on ? 'true' : 'false');\n    });\n    try { localStorage.setItem('ml-portfolio-lang', lang); } catch (e) {}\n    const html = document.documentElement;\n    html.setAttribute('lang', lang);\n    html.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');\n    if (!initial) window.scrollTo({ top: 0, behavior: 'auto' });\n    this.applyReveal(lang);\n  }\n\n  applyReveal(lang) {\n    if (this.reduce || !('IntersectionObserver' in window)) return;\n    const pane = document.querySelector('[data-lang-pane=\"' + lang + '\"]');\n    if (!pane) return;\n    if (!this._io) {\n      this._io = new IntersectionObserver(entries => {\n        entries.forEach(e => {\n          if (!e.isIntersecting) return;\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n          this._io.unobserve(e.target);\n        });\n      }, { rootMargin: '0px', threshold: 0.01 });\n    }\n    pane.querySelectorAll('[data-reveal]').forEach(n => {\n      if (n.dataset.revealReady) return;\n      n.dataset.revealReady = '1';\n      n.style.opacity = '0';\n      n.style.transform = 'translateY(16px)';\n      n.style.transition = 'opacity .7s cubic-bezier(.22,.61,.36,1), transform .7s cubic-bezier(.22,.61,.36,1)';\n      this._io.observe(n);\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
